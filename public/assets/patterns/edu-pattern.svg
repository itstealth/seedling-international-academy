<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <defs>
    <pattern id="edu" x="0" y="0" width="220" height="220" patternUnits="userSpaceOnUse">
      <!-- open book -->
      <g transform="translate(20,25) scale(0.9)" fill="none" stroke="#036268" stroke-width="1.5" opacity="0.22">
        <path d="M2 4 C 8 1, 18 1, 24 4 L 24 22 C 18 19, 8 19, 2 22 Z"/>
        <path d="M24 4 C 30 1, 40 1, 46 4 L 46 22 C 40 19, 30 19, 24 22"/>
        <line x1="2" y1="13" x2="24" y2="13"/>
        <line x1="46" y1="13" x2="24" y2="13"/>
      </g>
      <!-- pencil -->
      <g transform="translate(110,30) rotate(35) scale(0.7)" fill="none" stroke="#036268" stroke-width="1.5" opacity="0.22">
        <rect x="0" y="0" width="60" height="10"/>
        <polygon points="60,0 70,5 60,10"/>
        <line x1="15" y1="0" x2="15" y2="10"/>
        <line x1="45" y1="0" x2="45" y2="10"/>
      </g>
      <!-- atom -->
      <g transform="translate(40,140) scale(0.7)" fill="none" stroke="#036268" stroke-width="1.5" opacity="0.22">
        <circle cx="30" cy="30" r="3" fill="#036268"/>
        <ellipse cx="30" cy="30" rx="25" ry="10"/>
        <ellipse cx="30" cy="30" rx="25" ry="10" transform="rotate(60 30 30)"/>
        <ellipse cx="30" cy="30" rx="25" ry="10" transform="rotate(-60 30 30)"/>
      </g>
      <!-- lightbulb -->
      <g transform="translate(150,120) scale(0.7)" fill="none" stroke="#036268" stroke-width="1.5" opacity="0.22">
        <path d="M5 22 C 5 8, 25 8, 25 22 L 22 30 L 8 30 Z"/>
        <line x1="9" y1="34" x2="21" y2="34"/>
        <line x1="11" y1="38" x2="19" y2="38"/>
        <line x1="15" y1="4" x2="15" y2="10"/>
        <line x1="6" y1="14" x2="11" y2="17"/>
        <line x1="24" y1="14" x2="19" y2="17"/>
      </g>
      <!-- star -->
      <g transform="translate(80,180) scale(0.5)" fill="none" stroke="#036268" stroke-width="1.5" opacity="0.22">
        <polygon points="15,2 19,12 30,12 21,19 24,30 15,23 6,30 9,19 0,12 11,12"/>
      </g>
      <!-- ABC text -->
      <text x="170" y="190" fill="#036268" font-family="Georgia, serif" font-size="14" font-weight="bold" opacity="0.22">ABC</text>
    </pattern>
  </defs>
  <rect width="220" height="220" fill="url(#edu)"/>
</svg>